remote-ip: 192.168.200.130

spring:
  application:
    name: service-map
  profiles:
    active: dev
  main:
    allow-bean-definition-overriding: true
  cloud:
    nacos:
      discovery:
        server-addr: ${remote-ip}:8848
      config:
        server-addr: ${remote-ip}:8848
        prefix: ${spring.application.name}
        file-extension: yaml
        # 引入公共配置，腾讯地图 key 等公共参数取自 common-account.yaml
        shared-configs[0]:
          data-id: common-account.yaml
