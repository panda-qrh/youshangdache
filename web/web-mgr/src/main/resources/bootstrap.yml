remote-ip: 192.168.200.130

spring:
  application:
    name: web-mgr
  main:
    allow-bean-definition-overriding: true
  cloud:
    openfeign:
      lazy-attributes-resolution: true
      client:
        config:
          default:
            connectTimeout: 30000
            readTimeout: 30000
            loggerLevel: basic
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 1800000
      password:
      jedis:
        pool:
          max-active: 20
          max-wait: -1
          max-idle: 5
          min-idle: 0
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

feign:
  sentinel:
    enabled: true

server:
  port: 8603
