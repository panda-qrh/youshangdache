remote-ip: 192.168.200.130

spring:
  application:
    name: web-customer
  main:
    allow-bean-definition-overriding: true
  cloud:
    openfeign:
      lazy-attributes-resolution: true
      client:
        config:
          default:
            connectTimeout: 30000
            readTimeout: 30000
            loggerLevel: basic
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 1800000
      password:
      jedis:
        pool:
          max-active: 20
          max-wait: -1
          max-idle: 5
          min-idle: 0
  rabbitmq:
    host: 139.198.163.91
    port: 5672
    username: guest
    password: guest
    publisher-confirm-type: correlated
    publisher-returns: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

feign:
  sentinel:
    enabled: true

server:
  port: 8601
